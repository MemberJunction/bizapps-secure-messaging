<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ Secure Messaging – Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 2rem;
            background: #f5f5f5;
        }
        h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
        p.subtitle { color: #666; margin: 0 0 1.5rem; }
        .widget-container {
            max-width: 600px;
            height: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            overflow: hidden;
        }
    </style>
</head>
<body>
    <h1>Secure Messaging Demo</h1>
    <p class="subtitle">This page embeds the <code>&lt;mj-secure-messaging&gt;</code> widget.</p>

    <div class="widget-container">
        <mj-secure-messaging
            api-base-url="http://localhost:4000/secure-messaging/api/v1"
            brand-color="#1a73e8"
        ></mj-secure-messaging>
    </div>

    <script src="mj-secure-messaging.js"></script>
    <script>
        // Listen for widget events
        const widget = document.querySelector('mj-secure-messaging');
        widget.addEventListener('session-ready', (e) => {
            console.log('Session ready:', e.detail);
        });
        widget.addEventListener('session-expired', () => {
            console.log('Session expired');
        });
        widget.addEventListener('message-sent', (e) => {
            console.log('Message sent:', e.detail);
        });
    </script>
</body>
</html>
