name: Build All Packages

permissions:
  contents: read

on:
  workflow_dispatch:
  # Every merge to `next` or a release line rebuilds it with no `paths` filter.
  push:
    branches: [next, 'lts/**']
  pull_request:
    # `ready_for_review` is NOT in the default type set (opened/synchronize/reopened),
    # and the job below skips while the PR is a draft — without it, marking a PR ready
    # would not re-trigger anything and the check would never report.
    types: [opened, synchronize, reopened, ready_for_review]
    # `main` and `lts/**` included, and NO `paths` filter on the PR side: a workflow filtered
    # out at the `on:` level creates no check run at all, which would leave a required check
    # Pending forever.
    branches: [next, main, 'lts/**']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Must precede setup-node: `cache: 'pnpm'` needs pnpm already on PATH.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Validate repository.url in packages
        run: ./.github/scripts/validate-package-repository.sh

      - name: Validate packages restrict what they ship
        run: ./.github/scripts/validate-package-files.sh

      - name: CI guard script tests
        run: |
          ./.github/scripts/__tests__/validate-package-lock-case.test.sh
          ./.github/scripts/__tests__/check-bump-level.test.sh

      - name: CI guard specs
        run: node --test .github/scripts/__tests__/*.spec.mjs

      # PRs into next (and next itself) build against MJ next and the sibling apps' next, from
      # source, in one generated pnpm workspace; release PRs and lts/* lines install the committed
      # lockfile, i.e. the published versions. See .github/actions/ci-install/action.yml.
      - name: Install dependencies
        uses: ./.github/actions/ci-install

      - name: Build all packages
        run: pnpm run build:packages
