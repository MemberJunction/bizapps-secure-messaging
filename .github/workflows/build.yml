name: Build All Packages

on:
  workflow_dispatch:
  push:
    branches: [next]
    paths:
      - 'pnpm-lock.yaml'
      - 'packages/**'
  pull_request:
    branches: [next]
    paths:
      - 'pnpm-lock.yaml'
      - 'packages/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node: `cache: 'pnpm'` needs pnpm already on PATH.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Validate repository.url in packages
        run: ./.github/scripts/validate-package-repository.sh

      # A host installs one copy of MemberJunction and of each Open App: host-provided packages are
      # caret peers, never `dependencies`. Self-test first, so a pass means the check can fail.
      - name: Dependency model — MemberJunction and sibling apps are caret peers
        run: |
          node .github/scripts/check-dependency-model.mjs --self-test
          node .github/scripts/check-dependency-model.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build:packages
