# Merges the Version Packages PR — the one dispatch that turns a bump into a release.
#
# `version.yml` opens the release PR for a line and stops there: `changeset-release/main` -> `main`
# for the newest line, `changeset-release/lts/X.Y` -> `lts/X.Y` for a line that releases from its
# own branch. Merging it IS the release: the push runs `publish.yml`, which builds, publishes to
# npm under the line's dist-tag and tags. Leave `line` empty to release the newest line; name an
# older line (e.g. `6.1`) to release that one.
#
# Why a dispatch and not an auto-merge. `version.yml` runs on every push to a line, so
# auto-merging its PR on creation would make every backport publish. Releasing has
# to stay a decision; this workflow is where that decision is recorded.
#
# Why the only input is a line, never a PR. The App is a `pull_request`-mode bypass actor on
# `protect-main` (and `protect-lts`), which is what lets this merge skip the review requirement.
# The `line` input is checked against release-lines.json on `next` and only selects which of the
# changesets action's own branches to merge (`changeset-release/main` or
# `changeset-release/lts/X.Y`). The exemption is scoped by construction, not by trust.
name: Cut the Release

on:
  workflow_dispatch:
    inputs:
      line:
        description: 'Leave empty to release the newest line (through main). Or an older line that releases from its own branch, e.g. 6.1.'
        required: false
        default: ''

permissions:
  contents: read # the merge goes through the App token, not GITHUB_TOKEN

concurrency:
  group: "cut-release"
  cancel-in-progress: false # two cuts racing would publish twice

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: next
          sparse-checkout: |
            .github/scripts
            release-lines.json

      # Which release PR to merge. Empty = the line released through main.
      - name: Resolve the line
        id: line
        env:
          LINE: ${{ github.event.inputs.line }}
        run: |
          set -euo pipefail
          if [ -z "$LINE" ]; then
            RECORD=$(node .github/scripts/release-lines.mjs main-line --file release-lines.json)
          else
            if ! [[ "$LINE" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "::error::line must look like 6.1 (got '$LINE')."; exit 1
            fi
            RECORD=$(node .github/scripts/release-lines.mjs resolve "lts/$LINE" --file release-lines.json)
          fi
          if [ "$RECORD" = "{}" ]; then
            echo "::error::No such line in release-lines.json on next ('${LINE:-the line released through main}')."; exit 1
          fi
          if [ "$(jq -r .releasesThrough <<< "$RECORD")" = "main" ]; then
            [ -z "$LINE" ] || echo "::notice::$LINE releases through main."
            BASE=main
          else
            BASE=$(jq -r .branch <<< "$RECORD")
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=changeset-release/$BASE" >> "$GITHUB_OUTPUT"
          echo "Releasing line $(jq -r .key <<< "$RECORD"): changeset-release/$BASE -> $BASE"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Find the Version Packages PR
        id: find
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD: ${{ steps.line.outputs.head }}
          BASE: ${{ steps.line.outputs.base }}
        run: |
          set -euo pipefail

          COUNT=$(gh pr list --head "$HEAD" --base "$BASE" --state open \
                    --json number --jq 'length')
          if [ "$COUNT" = "0" ]; then
            echo "::error::No open $HEAD -> $BASE PR. Nothing to release: either no changeset has landed on the line since its last release, or version.yml has not finished opening the PR for the latest push. Check the Version Packages workflow."
            exit 1
          fi
          if [ "$COUNT" != "1" ]; then
            echo "::error::Found $COUNT open $HEAD -> $BASE PRs, expected 1. Refusing to guess which one releases. Close the extras."
            exit 1
          fi

          NUMBER=$(gh pr list --head "$HEAD" --base "$BASE" --state open \
                     --json number --jq '.[0].number')
          HEAD_SHA=$(gh pr view "$NUMBER" --json headRefOid --jq .headRefOid)
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Release PR: #$NUMBER at $HEAD_SHA"

      - name: Wait for the checks to settle
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NUMBER: ${{ steps.find.outputs.number }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            UNFINISHED=$(gh pr view "$NUMBER" --json statusCheckRollup --jq '
              [ .statusCheckRollup[]
                | select(
                    (.status  == "QUEUED") or (.status == "IN_PROGRESS") or
                    (.status  == "WAITING") or (.status == "PENDING") or
                    (.state   == "PENDING")
                  )
              ] | length')
            if [ "$UNFINISHED" = "0" ]; then
              echo "All checks have concluded after $attempt poll(s)."
              exit 0
            fi
            echo "$UNFINISHED check(s) still running (poll $attempt/40); waiting 15s."
            sleep 15
          done
          echo "::error::Checks on #$NUMBER were still running after 10 minutes. Not merging. Wait for them to finish and dispatch again."
          exit 1

      - name: Merge the release
        id: merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NUMBER: ${{ steps.find.outputs.number }}
          HEAD_SHA: ${{ steps.find.outputs.head_sha }}
          BASE: ${{ steps.line.outputs.base }}
        run: |
          set -euo pipefail

          if ! MERGE_OUTPUT=$(gh pr merge "$NUMBER" --merge --match-head-commit "$HEAD_SHA" 2>&1); then
            echo "$MERGE_OUTPUT"
            echo "::error::GitHub refused to merge #$NUMBER at $HEAD_SHA: ${MERGE_OUTPUT//$'\n'/ }. The PR stays open. A failing required check is the usual cause -- read the checks on the PR; if the head moved, dispatch again."
            exit 1
          fi

          STATE=$(gh pr view "$NUMBER" --json state --jq .state)
          if [ "$STATE" != "MERGED" ]; then
            echo "::error::gh pr merge succeeded but #$NUMBER is $STATE, not MERGED. Check the PR and merge it by hand if it is still open."
            exit 1
          fi

          echo "## Release cut" >> "$GITHUB_STEP_SUMMARY"
          echo "Merged #$NUMBER at \`$HEAD_SHA\`. The push to \`$BASE\` is now running publish.yml, which builds, publishes to npm and tags." >> "$GITHUB_STEP_SUMMARY"
