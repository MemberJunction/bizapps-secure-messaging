# The checks a migration must pass to enter `next`, or a release line (`lts/X.Y`) by backport.
#
# Scoped by TRIGGER to `next` and `lts/**` — release-side assertions (nothing pending, bump level,
# immutability on `main`) live in release-readiness.yml.
name: Validate Changes

permissions:
  contents: read

on:
  pull_request:
    # `ready_for_review` ensures marking a draft ready triggers required checks; `labeled`/`unlabeled`
    # re-runs jobs that honour exemption labels.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches: [next, 'lts/**']

concurrency:
  group: changes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-naming:
    name: 'migration naming'
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # Two refs:
      #   sha — the merge base of freshly-fetched base and HEAD, for what THIS PR changed.
      #   tip — the base branch tip, for the next-only timestamp watermark.
      - name: Resolve the merge base
        id: mb
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          echo "tip=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git merge-base FETCH_HEAD HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check for migration file changes
        id: migration_check
        run: |
          MIGRATION_FILES=$(git diff --name-only ${{ steps.mb.outputs.sha }} HEAD | grep -E '^migrations/.*\.sql$' || true)
          if [ -n "$MIGRATION_FILES" ]; then
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
            echo "Migration files changed:"
            echo "$MIGRATION_FILES"
          else
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
            echo "No migration files changed"
          fi

      - name: Validate migration filenames
        if: steps.migration_check.outputs.has_migrations == 'true'
        run: ./.github/scripts/validate-migration-filenames.sh

      # Advisory here: a missing Postgres counterpart annotates the PR but never fails it, so a
      # migration can land and get its converted file in a later PR. The release gate
      # (`rr: pg counterparts`) is where it becomes required.
      - name: New migrations should have a PostgreSQL counterpart (warning only)
        if: steps.migration_check.outputs.has_migrations == 'true'
        env:
          PG_COUNTERPART_LEVEL: warning
        run: ./.github/scripts/check-pg-counterpart.sh ${{ steps.mb.outputs.sha }} HEAD

      # `next` only. On a line, a backported migration is the same file with the same timestamp as on
      # `next`, so it is often older than the line's newest one, and backports can merge out of
      # order. `lines: migrations` (release-lines-gates.yml) keeps a watermark on a line instead: a
      # backport may not add a migration older than the line's newest.
      - name: Validate migration timestamps are newer than existing
        if: steps.migration_check.outputs.has_migrations == 'true' && github.base_ref == 'next'
        run: |
          MAX_EXISTING=$(git show ${{ steps.mb.outputs.tip }}:migrations/ 2>/dev/null | \
            grep -oE 'V[0-9]{12}' | sed 's/^V//' | sort -n | tail -1 || echo "0")

          NEW_FILES=$(git diff --diff-filter=A --name-only ${{ steps.mb.outputs.sha }} HEAD -- migrations/ | grep -E '\.sql$' || true)
          for file in $NEW_FILES; do
            basename=$(basename "$file")
            timestamp=$(echo "$basename" | grep -oE '^V[0-9]{12}' | sed 's/^V//' || true)
            if [ -n "$timestamp" ] && [ "$timestamp" -le "$MAX_EXISTING" ]; then
              echo "::error::Migration $basename has timestamp ($timestamp) <= max existing ($MAX_EXISTING)"
              exit 1
            fi
          done
          echo "All new migration timestamps are valid"

  migration-changeset:
    name: 'migration changeset'
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Resolve the merge base
        id: mb
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          echo "sha=$(git merge-base FETCH_HEAD HEAD)" >> "$GITHUB_OUTPUT"

      - name: Migrations require a minor or major changeset
        env:
          MIGRATION_CHANGESET_EXEMPT: ${{ contains(github.event.pull_request.labels.*.name, 'migration-changeset-exempt') }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ./.github/scripts/check-migration-changeset.sh --self-test
          ./.github/scripts/check-migration-changeset.sh ${{ steps.mb.outputs.sha }} HEAD

  migration-immutability:
    name: 'migration immutability'
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: No already-released migration may be edited
        env:
          MIGRATION_IMMUTABILITY_EXEMPT: ${{ contains(github.event.pull_request.labels.*.name, 'migration-immutability-exempt') }}
        run: |
          git fetch --no-tags origin main
          ./ci/check-migration-immutability.sh origin/main

  script-references:
    name: 'script references'
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Every script a workflow calls must exist
        run: ./.github/scripts/check-script-references.sh
