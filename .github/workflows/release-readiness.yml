# The gate on the release itself: the Version Packages PR of a line. For the newest line that is
# `changeset-release/main` -> `main`; for a line that releases from its own branch it is
# `changeset-release/lts/X.Y` -> `lts/X.Y`. On a line branch, every other PR is a backport, which
# carries changesets on purpose, so the jobs skip it (a skipped job satisfies a required check).
#
# Several independent contexts rather than one combined check, on purpose: each `rr:` check name
# identifies the exact condition that failed and is independently requireable.
name: Release readiness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches: [main, 'lts/**']

permissions:
  contents: read

jobs:
  changesets:
    name: 'rr: changesets'
    if: github.event.pull_request.draft == false && (github.base_ref == 'main' || startsWith(github.head_ref, 'changeset-release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: No changesets may be pending
        run: |
          PENDING=$(find .changeset -name "*.md" -not -name "README.md" 2>/dev/null | wc -l | tr -d ' ')
          if [ "$PENDING" -ne 0 ]; then
            echo "::error::$PENDING changeset(s) are still pending. A release PR must come from the line's Version Packages PR (version.yml), which consumes them. Merging this would put unversioned work on $GITHUB_BASE_REF, and publish.yml would refuse to run."
            find .changeset -name "*.md" -not -name "README.md" | sed 's/^/  /'
            exit 1
          fi
          echo "No pending changesets — releasing $(jq -r .version packages/Entities/package.json)"
          echo "Releasing **$(jq -r .version packages/Entities/package.json)**" >> "$GITHUB_STEP_SUMMARY"

  minor-bump:
    name: 'rr: minor bump'
    if: github.event.pull_request.draft == false && (github.base_ref == 'main' || startsWith(github.head_ref, 'changeset-release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true # resolves the previous release via `git tag --list 'v*'`

      - name: A release carrying migrations or metadata must be at least a minor
        run: ./ci/check-bump-level.sh

  metadata-shipped:
    name: 'rr: metadata shipped'
    if: github.event.pull_request.draft == false && (github.base_ref == 'main' || startsWith(github.head_ref, 'changeset-release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - run: ./ci/check-metadata-shipped.sh

  pg-counterparts:
    name: 'rr: pg counterparts'
    if: github.event.pull_request.draft == false && (github.base_ref == 'main' || startsWith(github.head_ref, 'changeset-release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Every migration since the last release has a PostgreSQL counterpart
        run: |
          . ./ci/lib/last-release.sh
          LAST_TAG=$(last_release_tag)
          if [ -z "$LAST_TAG" ]; then
            echo "No v* tag yet, so no release to compare against. Nothing to check."
            exit 0
          fi
          echo "Migrations added since $LAST_TAG:"
          ./.github/scripts/check-pg-counterpart.sh "$LAST_TAG" HEAD

  release-base-current:
    name: 'rr: release base current'
    if: github.event.pull_request.draft == false && (github.base_ref == 'main' || startsWith(github.head_ref, 'changeset-release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - run: ./ci/check-release-base-current.sh

  migration-immutability:
    name: 'rr: migration immutability'
    if: github.event.pull_request.draft == false && (github.base_ref == 'main' || startsWith(github.head_ref, 'changeset-release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: No already-released migration may be edited
        env:
          BASE_REF: ${{ github.base_ref }}
          MIGRATION_IMMUTABILITY_EXEMPT: ${{ contains(github.event.pull_request.labels.*.name, 'migration-immutability-exempt') }}
        run: |
          # A full fetch, not a shallow one: the three-dot compare needs history on both sides.
          git fetch --no-tags origin "$BASE_REF"
          ./ci/check-migration-immutability.sh "origin/$BASE_REF"

  packages-on-npm:
    name: 'rr: packages on npm'
    if: github.event.pull_request.draft == false && (github.base_ref == 'main' || startsWith(github.head_ref, 'changeset-release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Every publishable package must already exist on npm
        run: ./.github/scripts/validate-npm-packages.sh
